<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudX Ultra - Fast Actions</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            overflow: hidden; 
            margin: 0; 
            font-family: system-ui, -apple-system, sans-serif;
            background-image: radial-gradient(circle at 15% 15%, rgba(20, 184, 166, 0.1), transparent 35%),
                              radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.1), transparent 40%);
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
        ::-webkit-scrollbar-thumb { background: rgba(20, 184, 166, 0.3); border-radius: 10px; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .text-gradient-neon {
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-card {
            transform: translateZ(0);
            transition: transform 0.1s ease, border-color 0.1s ease;
        }
        @media (min-width: 768px) {
            .file-card:hover { transform: translateY(-2px); }
        }
    </style>
</head>
<body class="h-screen w-screen selection:bg-cyan-500/30 select-none">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Firebase config của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyBh4jMrMbwdPEs_ev9ApceqeOjy4J3enW8",
            authDomain: "cloudx-a60f3.firebaseapp.com",
            projectId: "cloudx-a60f3",
            storageBucket: "cloudx-a60f3.firebasestorage.app",
            messagingSenderId: "57398360452",
            appId: "1:57398360452:web:a7338dc0d72abc7efc45d1"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const Icons = {
            Logo: () => <svg className="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>,
            Folder: () => <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h1.52c.59 0 1.164.246 1.568.682l1.399 1.536a1.125 1.125 0 001.568 0l1.399-1.536a1.125 1.125 0 011.568 0l1.399 1.536a1.125 1.125 0 001.568 0l1.399-1.536a1.125 1.125 0 011.568 0H19.5a2.25 2.25 0 012.25 2.25v.425m-18 0h18M2.25 12.75a2.25 2.25 0 002.25 2.25h15a2.25 2.25 0 002.25-2.25m-18 0v4.5A2.25 2.25 0 004.5 19.5h15a2.25 2.25 0 002.25-2.25v-4.5"/></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.34 9m-4.72 0l-.34-9m9.49-3h-1.411c-.517 0-.967-.35-1.023-.85L11.168 2.58A1.875 1.875 0 009.61 1H14.39c.53 0 1.002.422 1.058.962l.227 2.16H19.5a3 3 0 013 3v.283c0 .84-.316 1.644-.882 2.254l-.47 4.97A3 3 0 0118.163 17H5.837a3 3 0 01-2.985-2.533L2.382 9.5a3.1 3.1 0 01-.882-2.254V7a3 3 0 013-3h1.411l.227-2.16A1.875 1.875 0 016.52 1h4.78a1.875 1.875 0 011.558.83l.227 2.16H14.74z"/></svg>,
            Image: () => <svg className="w-7 h-7 md:w-8 md:h-8 text-pink-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.9 2.9m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>,
            Video: () => <svg className="w-7 h-7 md:w-8 md:h-8 text-purple-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 10.362a.75.75 0 00-1.125-.65l-4.5 2.625a.75.75 0 000 1.3l4.5 2.625a.75.75 0 001.125-.65V10.362z"/></svg>,
            Doc: () => <svg className="w-7 h-7 md:w-8 md:h-8 text-blue-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>,
            Code: () => <svg className="w-7 h-7 md:w-8 md:h-8 text-cyan-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12"/></svg>,
            Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>,
            Pencil: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg>,
            Check: () => <svg className="w-3.5 h-3.5 text-slate-900" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>,
            Logout: () => <svg className="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>,
            // Icon loading xoay tròn mới thêm vào
            Spinner: () => <svg className="w-7 h-7 md:w-8 md:h-8 text-cyan-400 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        };

        const getCategory = (mime, name) => {
            if (mime?.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp)$/i.test(name)) return 'Image';
            if (mime?.startsWith('video/') || /\.(mp4|webm|mkv|mov)$/i.test(name)) return 'Video';
            if (/\.(js|ts|jsx|tsx|html|css|json|py|cpp)$/i.test(name)) return 'Code';
            return 'Doc';
        };

        const formatSize = (bytes) => {
            if (!bytes) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [authMode, setAuthMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [files, setFiles] = useState([]);
            const [currentTab, setCurrentTab] = useState('all');
            const [isGrouped, setIsGrouped] = useState(false);
            const [viewMode, setViewMode] = useState('grid');
            const [searchTerm, setSearchTerm] = useState('');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [toastMsg, setToastMsg] = useState(null);
            
            const INITIAL_LOAD = 60;
            const [visibleCount, setVisibleCount] = useState(INITIAL_LOAD);
            const [selectedIds, setSelectedIds] = useState([]);
            const [renameModal, setRenameModal] = useState({ isOpen: false, fileId: null, value: '' });
            
            // Trạng thái theo dõi file nào đang tải để kích hoạt hiệu ứng xoay
            const [downloadingId, setDownloadingId] = useState(null);

            const fileInputRef = useRef(null);
            let isMounted = useRef(true);
            let isSyncingFromCloud = useRef(false);
            let unsubscribeFiles = useRef(null);

            const triggerToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 2000);
            };

            const saveFilesToCloud = useCallback(async (userId, filesData) => {
                if (!userId || isSyncingFromCloud.current) return;
                try {
                    const userRef = db.collection('users').doc(userId);
                    await userRef.set({
                        files: filesData.map(f => ({
                            id: f.id,
                            name: f.name,
                            size: f.size,
                            category: f.category,
                            url: f.url || null,
                            isDeleted: f.isDeleted || false,
                            createdAt: f.createdAt
                        })),
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.error("Lỗi sync lên cloud:", err);
                }
            }, []);

            const loadFilesFromCloud = useCallback(async (userId) => {
                if (!userId) return [];
                try {
                    isSyncingFromCloud.current = true;
                    const userRef = db.collection('users').doc(userId);
                    const doc = await userRef.get();
                    if (doc.exists && doc.data().files) {
                        const loadedFiles = doc.data().files.map(f => ({
                            ...f,
                            isDeleted: f.isDeleted || false
                        }));
                        if (isMounted.current) {
                            setFiles(loadedFiles);
                        }
                        return loadedFiles;
                    } else {
                        if (isMounted.current) setFiles([]);
                        return [];
                    }
                } catch (err) {
                    console.error("Lỗi load từ cloud:", err);
                    if (isMounted.current) setFiles([]);
                    return [];
                } finally {
                    isSyncingFromCloud.current = false;
                }
            }, []);

            useEffect(() => {
                if (currentUser) {
                    const userRef = db.collection('users').doc(currentUser.uid);
                    unsubscribeFiles.current = userRef.onSnapshot((doc) => {
                        if (doc.exists && doc.data().files && !isSyncingFromCloud.current) {
                            const cloudFiles = doc.data().files.map(f => ({
                                ...f,
                                isDeleted: f.isDeleted || false
                            }));
                            if (JSON.stringify(cloudFiles) !== JSON.stringify(files)) {
                                setFiles(cloudFiles);
                            }
                        }
                    }, (err) => {
                        console.error("Lỗi realtime:", err);
                    });
                    
                    return () => {
                        if (unsubscribeFiles.current) {
                            unsubscribeFiles.current();
                        }
                    };
                }
            }, [currentUser]);

            useEffect(() => {
                if (currentUser && !isSyncingFromCloud.current) {
                    const timeout = setTimeout(() => {
                        saveFilesToCloud(currentUser.uid, files);
                    }, 1000);
                    return () => clearTimeout(timeout);
                }
            }, [files, currentUser, saveFilesToCloud]);

            const handleAuth = async (e) => {
                e.preventDefault();
                if (!email || !password) return triggerToast("Vui lòng nhập đủ thông tin!");
                
                try {
                    if (authMode === 'register') {
                        await auth.createUserWithEmailAndPassword(email, password);
                        triggerToast("✅ Đăng ký thành công!");
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                        triggerToast(`👋 Chào mừng ${email.split('@')[0]}!`);
                    }
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        triggerToast("❌ Email đã được đăng ký!");
                    } else if (err.code === 'auth/wrong-password') {
                        triggerToast("❌ Sai mật khẩu!");
                    } else if (err.code === 'auth/user-not-found') {
                        triggerToast("❌ Tài khoản không tồn tại!");
                    } else {
                        triggerToast("❌ " + err.message);
                    }
                }
            };

            useEffect(() => {
                isMounted.current = true;
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setCurrentUser(user);
                        setEmail(user.email || '');
                        await loadFilesFromCloud(user.uid);
                        if (window.innerWidth >= 768) setSidebarOpen(true);
                    } else {
                        setCurrentUser(null);
                        setFiles([]);
                        setEmail('');
                        setPassword('');
                    }
                });
                return () => {
                    isMounted.current = false;
                    unsubscribe();
                };
            }, []);

            const handleLogout = async () => {
                await auth.signOut();
                setCurrentUser(null);
                setFiles([]);
                triggerToast("Đã đăng xuất!");
            };

            const processUploadFiles = (fileList) => {
                const arr = Array.from(fileList);
                if (!arr.length) return;

                const processed = arr.map(f => {
                    const cat = getCategory(f.type, f.name);
                    return {
                        id: crypto.randomUUID(),
                        name: f.name,
                        size: f.size,
                        category: cat,
                        createdAt: Date.now(),
                        isDeleted: false,
                        url: URL.createObjectURL(f)
                    };
                });

                setFiles([...processed, ...files]);
                triggerToast(`✅ Đã tải lên ${processed.length} tệp`);
            };

            useEffect(() => {
                setVisibleCount(INITIAL_LOAD);
            }, [currentTab, searchTerm, isGrouped]);

            const filteredFiles = useMemo(() => {
                return files.filter(f => {
                    const matchTab = currentTab === 'all' ? !f.isDeleted : f.isDeleted;
                    const matchSearch = f.name.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchTab && matchSearch;
                });
            }, [files, currentTab, searchTerm]);

            const displayedFiles = useMemo(() => {
                return filteredFiles.slice(0, visibleCount);
            }, [filteredFiles, visibleCount]);

            const groupedFiles = useMemo(() => {
                if (!isGrouped) return null;
                const groups = {};
                displayedFiles.forEach(file => {
                    const parts = file.name.split('.');
                    const ext = parts.length > 1 ? parts.pop().toLowerCase() : 'Khác';
                    if (!groups[ext]) groups[ext] = [];
                    groups[ext].push(file);
                });
                return groups;
            }, [displayedFiles, isGrouped]);

            const handleScroll = (e) => {
                const { scrollTop, clientHeight, scrollHeight } = e.currentTarget;
                if (scrollHeight - scrollTop <= clientHeight + 150) {
                    if (visibleCount < filteredFiles.length) {
                        setVisibleCount(prev => prev + 40);
                    }
                }
            };

            const handleSelectFile = (id, e) => {
                e.stopPropagation();
                setSelectedIds(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
            };

            const switchTab = (tab) => {
                setCurrentTab(tab);
                setSelectedIds([]);
                if (window.innerWidth < 768) setSidebarOpen(false);
            };

            const handleSelectAll = () => {
                const currentFilteredIds = filteredFiles.map(f => f.id);
                const isAllSelected = currentFilteredIds.length > 0 && currentFilteredIds.every(id => selectedIds.includes(id));
                
                if (isAllSelected) {
                    setSelectedIds(prev => prev.filter(id => !currentFilteredIds.includes(id)));
                } else {
                    setSelectedIds(prev => [...new Set([...prev, ...currentFilteredIds])]);
                }
            };

            const bulkMoveToTrash = () => {
                setFiles(files.map(f => selectedIds.includes(f.id) ? { ...f, isDeleted: true } : f));
                triggerToast(`🗑️ Đã chuyển ${selectedIds.length} tệp vào thùng rác.`);
                setSelectedIds([]);
            };

            const bulkRestore = () => {
                setFiles(files.map(f => selectedIds.includes(f.id) ? { ...f, isDeleted: false } : f));
                triggerToast(`🔄 Đã khôi phục ${selectedIds.length} tệp.`);
                setCurrentTab('all');
                setSelectedIds([]);
            };

            const bulkPermanentlyDelete = () => {
                setFiles(files.filter(f => !selectedIds.includes(f.id)));
                triggerToast(`💀 Đã xóa vĩnh viễn ${selectedIds.length} tệp.`);
                setSelectedIds([]);
            };

            // HÀM TẢI FILE ĐÃ ĐƯỢC TỐI ƯU SIÊU MƯỢT CHO ĐIỆN THOẠI
            const handleDownloadFile = async (file) => {
                if (!file || downloadingId) return;
                
                // 1. Hiện icon xoay tức thì để phản hồi thao tác chạm
                setDownloadingId(file.id);
                
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                let finalUrl = file.url;

                // Nếu không có URL sẵn (dữ liệu mock), tạo một Blob giả lập để làm dữ liệu mẫu
                if (!finalUrl) {
                    const blob = new Blob(["CloudX Secure Content: " + file.name], { type: "text/plain;charset=utf-8" });
                    finalUrl = URL.createObjectURL(blob);
                }

                // 2. Thực hiện tải file dựa trên thiết bị
                if (isMobile) {
                    // Đối với Mobile: Mở bằng tab mới/Native Viewer. Hệ điều hành di động 
                    // sẽ tự động kích hoạt tính năng Lưu file hoặc Chia sẻ cực kì mượt, không sợ bị chặn.
                    window.open(finalUrl, '_blank');
                } else {
                    // Đối với PC: Tạo thẻ 'a' ẩn để tự động download ngầm xuống thư mục Downloads
                    const a = document.createElement('a');
                    a.href = finalUrl;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }

                // Giữ hiệu ứng xoay nhẹ thêm 400ms để hoạt ảnh mượt mắt, không bị giật UI đột ngột
                setTimeout(() => {
                    setDownloadingId(null);
                    triggerToast(`📥 Đã xử lý mở tệp: ${file.name}`);
                }, 400);
            };

            const startRename = (file) => {
                setRenameModal({ isOpen: true, fileId: file.id, value: file.name });
            };

            const submitRename = () => {
                const newName = renameModal.value.trim();
                if (newName && renameModal.fileId) {
                    setFiles(files.map(f => f.id === renameModal.fileId ? { ...f, name: newName } : f));
                    triggerToast("✏️ Đã cập nhật tên tệp tin!");
                }
                setRenameModal({ isOpen: false, fileId: null, value: '' });
            };

            const totalSize = files.reduce((acc, f) => acc + (f.isDeleted ? 0 : f.size), 0);

            if (!currentUser) {
                return (
                    <div className="flex items-center justify-center h-screen w-full relative">
                        {toastMsg && (
                            <div className="fixed top-4 z-50 glass-panel border border-cyan-500/40 text-cyan-200 px-5 py-3 rounded-xl text-sm font-semibold shadow-xl">
                                {toastMsg}
                            </div>
                        )}
                        <div className="glass-panel border border-white/10 rounded-2xl w-full max-w-sm p-8 shadow-2xl flex flex-col gap-6">
                            <h1 className="text-3xl font-bold text-center text-gradient-neon flex items-center justify-center gap-2 mb-2">
                                <Icons.Logo /> CloudX <span className="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-1 rounded-full font-normal">Ultra</span>
                            </h1>
                            <p className="text-center text-xs text-slate-500 -mt-2">☁️ Đồng bộ đa thiết bị</p>
                            <form onSubmit={handleAuth} className="flex flex-col gap-4">
                                <div>
                                    <label className="text-xs text-slate-400 font-bold uppercase block mb-1">Email</label>
                                    <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                           className="w-full bg-slate-900 border border-white/10 focus:border-cyan-500 text-white rounded-xl px-4 py-2 outline-none" required />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400 font-bold uppercase block mb-1">Mật khẩu</label>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                                           className="w-full bg-slate-900 border border-white/10 focus:border-cyan-500 text-white rounded-xl px-4 py-2 outline-none" required />
                                </div>
                                <button type="submit" className="w-full py-3 rounded-xl text-white font-bold bg-gradient-to-r from-cyan-500 to-purple-600 hover:opacity-90 transition-all mt-2 shadow-lg">
                                    {authMode === 'login' ? '🔐 ĐĂNG NHẬP' : '📝 ĐĂNG KÝ'}
                                </button>
                            </form>
                            <div className="text-center">
                                <button type="button" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-sm text-cyan-400 hover:underline">
                                    {authMode === 'login' ? '✨ Chưa có tài khoản? Đăng ký ngay' : '⬅️ Đã có tài khoản? Đăng nhập'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const renderFileCard = (file) => {
                const isSelected = selectedIds.includes(file.id);
                // Biến kiểm tra xem file này có đang được xử lý tải hay không
                const isThisFileDownloading = downloadingId === file.id;

                return (
                    <div key={file.id} 
                        onClick={(e) => { 
                            e.stopPropagation(); 
                            if (selectedIds.length > 0) handleSelectFile(file.id, e);
                            else handleDownloadFile(file); 
                        }}
                        onContextMenu={(e) => { 
                            e.preventDefault(); 
                            e.stopPropagation(); 
                            startRename(file);
                        }}
                        className={`file-card glass-panel group relative rounded-xl cursor-pointer p-3 md:p-4 border select-none overflow-hidden active:scale-[0.98] md:active:scale-100
                        ${isSelected ? 'border-cyan-500/60 bg-cyan-950/20 shadow-[0_0_15px_rgba(34,211,238,0.15)]' : 'border-white/5'}
                        ${viewMode === 'grid' ? 'flex flex-col items-center text-center' : 'flex flex-row items-center justify-between gap-3'}`}>
                        
                        <div onClick={(e) => handleSelectFile(file.id, e)} 
                            className={`absolute top-2.5 left-2.5 w-5 h-5 rounded border transition-all z-20 flex items-center justify-center bg-slate-950/80
                            ${isSelected ? 'bg-cyan-400 border-cyan-400' : 'border-white/20 opacity-100 md:opacity-0 md:group-hover:opacity-100'}`}>
                            {isSelected && <Icons.Check />}
                        </div>

                        <div className={`flex ${viewMode === 'grid' ? 'flex-col items-center w-full' : 'items-center gap-3'} flex-1 min-w-0`}>
                            <div className={viewMode === 'grid' ? 'mb-2 mt-4' : 'shrink-0'}>
                                {/* Thay đổi icon thành Spinner nếu file này đang được tải */}
                                {isThisFileDownloading ? (
                                    <Icons.Spinner />
                                ) : (
                                    <>
                                        {file.category === 'Image' && <Icons.Image />}
                                        {file.category === 'Video' && <Icons.Video />}
                                        {file.category === 'Code' && <Icons.Code />}
                                        {file.category === 'Doc' && <Icons.Doc />}
                                    </>
                                )}
                            </div>
                            
                            <div className="w-full min-w-0 overflow-hidden">
                                <p className="text-xs md:text-sm font-semibold text-slate-200 truncate group-hover:text-cyan-300 w-full block" title={file.name}>{file.name}</p>
                                <p className="text-[10px] md:text-xs text-slate-500 mt-0.5 truncate w-full block">
                                    {isThisFileDownloading ? "Đang xử lý..." : formatSize(file.size)}
                                </p>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex h-screen w-full relative overflow-hidden">
                    <input type="file" ref={fileInputRef} onChange={(e) => processUploadFiles(e.target.files)} multiple className="hidden" />

                    {toastMsg && (
                        <div className="fixed bottom-4 right-4 left-4 md:left-auto md:right-6 z-50 glass-panel border border-cyan-500/40 text-cyan-200 px-5 py-3 rounded-xl text-center md:text-left text-xs md:text-sm font-semibold shadow-xl">
                            {toastMsg}
                        </div>
                    )}

                    {sidebarOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 md:hidden transition-opacity" onClick={() => setSidebarOpen(false)} />
                    )}

                    <aside className={`fixed md:static inset-y-0 left-0 z-40 flex flex-col h-full glass-panel border-r border-white/5 transition-transform duration-300 rounded-r-2xl md:rounded-none overflow-hidden
                        ${sidebarOpen ? 'w-64 p-5 translate-x-0' : 'w-64 p-5 -translate-x-full md:translate-x-0 md:w-20 md:p-3 md:items-center'}`}>
                        
                        <div className="flex items-center justify-between w-full mb-6 md:mb-8">
                            {(sidebarOpen || window.innerWidth < 768) && (
                                <h1 className="text-lg font-bold text-gradient-neon flex items-center gap-2">
                                    <Icons.Logo /> CloudX <span className="text-[10px] bg-cyan-500/10 text-cyan-400 px-1.5 py-0.5 rounded-full font-normal">Ultra</span>
                                </h1>
                            )}
                            <button onClick={() => setSidebarOpen(false)} className="p-1 text-slate-400 hover:text-white md:hidden">✕</button>
                        </div>

                        <button onClick={(e) => { e.stopPropagation(); fileInputRef.current.click(); }} 
                                className="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl text-white font-bold text-xs bg-gradient-to-r from-cyan-500 to-purple-600 hover:opacity-90 active:scale-95 transition-all mb-6 shadow-lg shrink-0">
                            <Icons.Upload /> {(sidebarOpen || window.innerWidth < 768) && "TẢI TỆP LÊN"}
                        </button>

                        <nav className="flex flex-col gap-1 w-full flex-1">
                            <button onClick={() => switchTab('all')} 
                                className={`flex items-center gap-3 w-full p-3 rounded-xl transition-all text-xs md:text-sm font-semibold                                ${currentTab === 'all' ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/20' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'}`}>
                                <Icons.Folder /> {(sidebarOpen || window.innerWidth < 768) && "Tệp tin của tôi"}
                            </button>
                            <button onClick={() => switchTab('trash')} 
                                className={`flex items-center gap-3 w-full p-3 rounded-xl transition-all text-xs md:text-sm font-semibold
                                ${currentTab === 'trash' ? 'bg-pink-500/10 text-pink-300 border border-pink-500/20' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'}`}>
                                <Icons.Trash /> {(sidebarOpen || window.innerWidth < 768) && "Thùng rác"}
                            </button>
                        </nav>

                        {(sidebarOpen || window.innerWidth < 768) && (
                            <div className="w-full shrink-0 mt-auto flex flex-col gap-3">
                                <div className="bg-slate-950/40 p-4 rounded-xl border border-white/5">
                                    <span className="text-[10px] text-slate-500 block font-bold tracking-wider">DUNG LƯỢNG</span>
                                    <span className="text-cyan-400 text-base font-black block mt-0.5">{formatSize(totalSize)}</span>
                                </div>
                                <div className="bg-slate-950/40 p-2 rounded-xl border border-white/5">
                                    <span className="text-[10px] text-slate-500 block font-bold tracking-wider">TÀI KHOẢN</span>
                                    <span className="text-slate-300 text-xs block truncate">{currentUser?.email}</span>
                                </div>
                                <button onClick={handleLogout} className="flex items-center justify-center gap-2 w-full p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs hover:bg-rose-500/20 transition-all">
                                    <Icons.Logout /> ĐĂNG XUẤT
                                </button>
                            </div>
                        )}
                        {(!sidebarOpen && window.innerWidth >= 768) && (
                            <button onClick={handleLogout} className="mt-auto p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 transition-all" title="Đăng xuất">
                                <Icons.Logout />
                            </button>
                        )}
                    </aside>

                    <main className="flex-1 h-full flex flex-col p-4 md:p-6 overflow-hidden relative">
                        
                        <header className="w-full glass-panel rounded-xl p-3 md:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 md:mb-6 shrink-0">
                            <div className="flex items-center gap-2 md:gap-4 flex-1 min-w-0">
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white shrink-0">
                                    <Icons.Menu />
                                </button>
                                <input type="text" placeholder="Tìm tệp tin..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                    className="bg-slate-950/60 border border-white/10 rounded-xl px-3 py-2 outline-none text-xs md:text-sm w-full max-w-[160px] md:max-w-xs focus:border-cyan-500/40" />
                                
                                {filteredFiles.length > 0 && (
                                    <button onClick={handleSelectAll} className="text-[11px] font-bold text-slate-400 hover:text-cyan-400 border border-white/10 px-2.5 py-2 rounded-xl bg-slate-900/40 shrink-0 flex items-center gap-1.5">
                                        <div className={`w-3.5 h-3.5 rounded border border-slate-500 flex items-center justify-center ${filteredFiles.every(f => selectedIds.includes(f.id)) ? 'bg-cyan-400 border-cyan-400' : ''}`}>
                                            {filteredFiles.every(f => selectedIds.includes(f.id)) && <Icons.Check />}
                                        </div>
                                        <span className="hidden sm:inline">Chọn hết</span>
                                    </button>
                                )}
                            </div>
                            
                            <div className="flex items-center gap-2 justify-between sm:justify-end shrink-0">
                                <button onClick={() => setIsGrouped(!isGrouped)}
                                    className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all border flex items-center gap-1.5
                                    ${isGrouped 
                                        ? 'bg-gradient-to-r from-purple-600 to-cyan-500 text-white border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.3)]' 
                                        : 'bg-slate-950/60 text-slate-400 border-white/10 hover:text-slate-200'}`}>
                                    <span>⚡ {isGrouped ? "Đang gom nhóm" : "Tự động gom nhóm"}</span>
                                </button>

                                <div className="flex gap-0.5 bg-slate-950/60 p-0.5 rounded-lg border border-white/5">
                                    <button onClick={() => setViewMode('grid')} className={`px-2.5 py-1 rounded-md text-[10px] font-bold ${viewMode === 'grid' ? 'bg-white/10 text-cyan-400' : 'text-slate-400'}`}>GRID</button>
                                    <button onClick={() => setViewMode('list')} className={`px-2.5 py-1 rounded-md text-[10px] font-bold ${viewMode === 'list' ? 'bg-white/10 text-cyan-400' : 'text-slate-400'}`}>LIST</button>
                                </div>
                            </div>
                        </header>

                        <div onScroll={handleScroll} className="flex-1 rounded-2xl overflow-y-auto relative p-0.5">
                            
                            {isGrouped && groupedFiles ? (
                                <div className="flex flex-col gap-6 pb-24">
                                    {Object.keys(groupedFiles).map(ext => (
                                        <div key={ext} className="w-full">
                                            <div className="flex items-center gap-2 mb-3 border-b border-white/5 pb-1">
                                                <Icons.Folder />
                                                <h3 className="text-xs md:text-sm font-black tracking-wider uppercase text-cyan-400">
                                                    Đuôi .{ext} <span className="text-[11px] font-normal text-slate-500 lowercase">({groupedFiles[ext].length} tệp)</span>
                                                </h3>
                                            </div>
                                            <div className={viewMode === 'grid' ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-4' : 'flex flex-col gap-2'}>
                                                {groupedFiles[ext].map(file => renderFileCard(file))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className={viewMode === 'grid' ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-4 pb-24' : 'flex flex-col gap-2 pb-24'}>
                                    {displayedFiles.map(file => renderFileCard(file))}
                                </div>
                            )}

                            {filteredFiles.length > 0 && visibleCount < filteredFiles.length && (
                                <div className="text-center py-4 text-xs text-slate-500 font-bold animate-pulse">Đang nạp thêm tài nguyên dữ liệu mượt mà...</div>
                            )}

                            {filteredFiles.length === 0 && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-4 text-center">
                                    <p className="text-xs md:text-sm font-bold text-slate-400">Không tìm thấy hoặc thư mục trống</p>
                                    <button onClick={() => fileInputRef.current.click()} className="mt-3 px-4 py-2 border border-dashed border-white/10 hover:border-cyan-500/40 text-[11px] rounded-xl text-slate-400 hover:text-cyan-400 font-semibold">
                                        Nhấp vào đây để tải file lên
                                    </button>
                                </div>
                            )}
                        </div>

                        {selectedIds.length > 0 && (
                            <div className="fixed bottom-4 left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 z-40 glass-panel border border-cyan-500/40 rounded-2xl p-3 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-[0_10px_30px_rgba(0,0,0,0.6)]">
                                <span className="text-[10px] md:text-xs font-bold text-cyan-300 tracking-wider shrink-0">ĐÃ CHỌN: {selectedIds.length} FILE</span>
                                <div className="flex gap-1.5 w-full sm:w-auto justify-end">
                                    {currentTab === 'all' ? (
                                        <button onClick={bulkMoveToTrash} className="flex-1 sm:flex-none px-3 py-2 bg-rose-500/20 text-rose-400 font-bold text-[10px] md:text-xs rounded-xl border border-rose-500/20">THÙNG RÁC</button>
                                    ) : (
                                        <>
                                            <button onClick={bulkRestore} className="flex-1 sm:flex-none px-3 py-2 bg-emerald-500/20 text-emerald-400 font-bold text-[10px] md:text-xs rounded-xl border border-emerald-500/20">KHÔI PHỤC</button>
                                            <button onClick={bulkPermanentlyDelete} className="flex-1 sm:flex-none px-3 py-2 bg-rose-600 text-white font-bold text-[10px] md:text-xs rounded-xl">XÓA VĨNH VIỄN</button>
                                        </>
                                    )}
                                    <button onClick={() => setSelectedIds([])} className="px-3 py-2 bg-white/5 text-slate-300 font-bold text-[10px] md:text-xs rounded-xl">HỦY</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {renameModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-md z-50 flex items-center justify-center p-4"
                             onClick={() => setRenameModal({ isOpen: false, fileId: null, value: '' })}
                             onKeyDown={(e) => e.key === 'Escape' && setRenameModal({ isOpen: false, fileId: null, value: '' })}>
                            <div className="glass-panel border border-cyan-500/30 rounded-2xl w-full max-w-md overflow-hidden shadow-[0_0_50px_rgba(34,211,238,0.15)] p-5 flex flex-col gap-4"
                                 onClick={(e) => e.stopPropagation()}>
                                
                                <div className="flex items-center gap-2 border-b border-white/5 pb-2">
                                    <div className="p-1.5 bg-cyan-500/10 rounded-lg text-cyan-400"><Icons.Pencil /></div>
                                    <h4 className="text-sm font-bold text-slate-100">Thay đổi tên tệp tin</h4>
                                </div>
                                
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-[11px] text-slate-400 font-bold tracking-wide uppercase">Tên tệp tin mới</label>
                                    <input 
                                        type="text" 
                                        value={renameModal.value} 
                                        onChange={(e) => setRenameModal(prev => ({ ...prev, value: e.target.value }))}
                                        onKeyDown={(e) => e.key === 'Enter' && submitRename()}
                                        autoFocus
                                        className="bg-slate-900 border border-white/10 focus:border-cyan-500 text-slate-100 rounded-xl px-4 py-2.5 text-sm outline-none w-full transition-all shadow-inner focus:shadow-[0_0_10px_rgba(34,211,238,0.1)]"
                                        placeholder="Nhập tên mới..." 
                                    />
                                </div>

                                <div className="flex gap-2 justify-end mt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setRenameModal({ isOpen: false, fileId: null, value: '' })}
                                        className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 hover:bg-white/5 border border-transparent transition-all">
                                        HỦY BỎ
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={submitRename}
                                        className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-cyan-500 to-purple-600 hover:opacity-90 shadow-lg shadow-cyan-500/20 active:scale-95 transition-all">
                                        LƯU THAY ĐỔI
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
